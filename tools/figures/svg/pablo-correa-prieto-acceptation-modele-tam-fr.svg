<text x="115" y="745" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Ce que ces enquêtes mesurent, et où s’arrête leur validation : voir l’article « L’acceptation n’est pas l’usage ».</text>
