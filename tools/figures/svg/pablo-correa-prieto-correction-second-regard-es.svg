<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Una segunda mirada, no un corrector<tspan fill="#B8492A">.</tspan></text>
