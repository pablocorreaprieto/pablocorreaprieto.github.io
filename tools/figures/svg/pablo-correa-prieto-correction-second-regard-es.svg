<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Según el dispositivo de puntuación en paralelo descrito por Ofqual (Williamson, 2026). La decisión final es del docente.</text>
