<text class="serif" x="535" y="648" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="450" fill="#1C2128" data-maxw="340">Propone una nota</text>
<text class="serif" x="535" y="690" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="450" fill="#1C2128" data-maxw="340">o un comentario</text>
