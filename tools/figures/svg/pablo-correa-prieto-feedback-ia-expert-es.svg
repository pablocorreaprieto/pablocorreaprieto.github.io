<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">FEEDBACK · DATOS PUBLICADOS</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Útil, pero no para transmitirlo<tspan fill="#B8492A">.</tspan></text>
<text x="115" y="290" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Devoluciones juzgadas útiles para la revisión por 89 futuros docentes, sin conocer su origen</text>
