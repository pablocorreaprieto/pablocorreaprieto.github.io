<text x="1342.8" y="520" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#1C2128" text-anchor="start">59 %</text>
<text x="115" y="602" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2128" text-anchor="start" data-maxw="745">Devolución del modelo que el evaluador</text>
