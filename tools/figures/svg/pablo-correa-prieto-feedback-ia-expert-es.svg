<text x="115" y="506" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2128" text-anchor="start" data-maxw="745">Devolución de un modelo de lenguaje,</text>
<text x="115" y="540" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2128" text-anchor="start" data-maxw="745">juzgada útil para la revisión</text>
