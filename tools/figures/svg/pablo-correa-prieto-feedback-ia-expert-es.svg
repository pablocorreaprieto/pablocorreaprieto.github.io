<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Datos: Jansen, T. et al. (2024). Comparing generative AI and expert feedback to students’ writing.</text>
<text x="115" y="780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Psychologie in Erziehung und Unterricht, 71(2), 80–92. Gráfico: Pablo Correa Prieto.</text>
