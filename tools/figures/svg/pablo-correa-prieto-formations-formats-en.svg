.serif{font-variation-settings:'opsz' 60}
</style>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M1,1 L10,6 L1,11" fill="none" stroke="#264A6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1800" height="945" fill="#FAFAF8"/>
<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">TRAINING · SCHOOL TEAMS</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Three formats, one classroom base<tspan fill="#B8492A">.</tspan></text>
<line x1="115" y1="300" x2="599" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="115" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="60" font-weight="400" fill="#B8492A" data-maxw="484">90 min</text>
<text class="serif" x="115" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Talk and workshop</text>
<text x="115" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">Understand what generative</text>
<text x="115" y="571" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">AI changes for preparing,</text>
<text x="115" y="610" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">assessing and helping</text>
<text x="115" y="650" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">pupils learn.</text>
<line x1="658" y1="300" x2="1142" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="658" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="60" font-weight="400" fill="#B8492A" data-maxw="484">Half day</text>
<text class="serif" x="658" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Hands-on workshop</text>
<text x="658" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">Work on your own teaching</text>
<text x="658" y="571" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">sequences, with cases</text>
<text x="658" y="610" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">drawn from Vaud</text>
<text x="658" y="650" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">classrooms.</text>
<line x1="1201" y1="300" x2="1685" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="1201" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="60" font-weight="400" fill="#B8492A" data-maxw="484">3 sessions</text>
<text class="serif" x="1201" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Team pathway</text>
<text x="1201" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">End with an AI-use charter</text>
<text x="1201" y="571" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">of the school’s own,</text>
<text x="1201" y="610" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">carried by the team.</text>
<text x="115" y="712" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#1C2128" text-anchor="start" data-maxw="1570">Nothing to sell: the content comes from the classroom and from the work presented on this site.</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">The author’s training offer, detailed at pablocorreaprieto.ch/en/training. Diagram: Pablo Correa Prieto.</text>
<line x1="115" y1="795" x2="1685" y2="795" stroke="#E2E3DF" stroke-width="2"/>
<text x="115" y="855" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28"><tspan font-weight="600" fill="#1C2128">Pablo Correa Prieto</tspan><tspan fill="#5B626C"> · teacher and education researcher</tspan></text>
<text x="1685" y="854" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#264A6E" text-anchor="end" letter-spacing="3">PABLOCORREAPRIETO.CH</text>
<text x="1685" y="919" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6C737C" text-anchor="end">Pablo Correa Prieto · 2026 · CC BY 4.0</text>
</svg>
