<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="945" viewBox="0 0 1800 945" lang="fr">
<defs>
<style>
@font-face{font-family:'Source Serif 4'; src:url(../../title-card/fonts/source-serif-4-latin-opsz-normal.woff2) format('woff2'); font-weight:200 900}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); font-weight:400}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); font-weight:500}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); font-weight:600}
.serif{font-variation-settings:'opsz' 60}
</style>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M1,1 L10,6 L1,11" fill="none" stroke="#264A6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1800" height="945" fill="#FAFAF8"/>
<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">REPÈRES POUR LA CLASSE · PROPOSITION</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Quatre questions avant d’utiliser l’IA<tspan fill="#B8492A">.</tspan></text>
<rect x="115" y="282" width="1570" height="92" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="153" y="342" font-family="'Source Serif 4', Georgia, serif" font-size="40" font-weight="400" fill="#B8492A">1</text>
<text class="serif" x="215" y="340" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="500" fill="#1C2128" data-maxw="300">Données</text>
<text x="585" y="338" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1060">Des données d’élèves sortent-elles de l’école ? Si oui, on s’arrête là.</text>
<rect x="115" y="392" width="1570" height="92" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="153" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="40" font-weight="400" fill="#B8492A">2</text>
<text class="serif" x="215" y="450" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="500" fill="#1C2128" data-maxw="300">Alignement</text>
<text x="585" y="448" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1060">La tâche sert-elle un objectif du PER, ou seulement la nouveauté de l’outil ?</text>
<rect x="115" y="502" width="1570" height="92" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="153" y="562" font-family="'Source Serif 4', Georgia, serif" font-size="40" font-weight="400" fill="#B8492A">3</text>
<text class="serif" x="215" y="560" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="500" fill="#1C2128" data-maxw="300">Effort</text>
<text x="585" y="558" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1060">L’effort qui fait apprendre reste-t-il chez l’élève, ou passe-t-il à la machine ?</text>
<rect x="115" y="612" width="1570" height="92" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="153" y="672" font-family="'Source Serif 4', Georgia, serif" font-size="40" font-weight="400" fill="#B8492A">4</text>
<text class="serif" x="215" y="670" font-family="'Source Serif 4', Georgia, serif" font-size="33" font-weight="500" fill="#1C2128" data-maxw="300">Transparence</text>
<text x="585" y="668" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1060">Élèves et parents savent-ils quand et comment l’IA a été utilisée ?</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Proposition de l’auteur, à partir des recommandations de la CIIP (2025) et des travaux cités dans les articles de ce site.</text>
<text x="115" y="780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Schéma : Pablo Correa Prieto.</text>
<line x1="115" y1="795" x2="1685" y2="795" stroke="#E2E3DF" stroke-width="2"/>
<text x="115" y="855" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28"><tspan font-weight="600" fill="#1C2128">Pablo Correa Prieto</tspan><tspan fill="#5B626C"> · enseignant et recherche en éducation</tspan></text>
<text x="1685" y="854" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#264A6E" text-anchor="end" letter-spacing="3">PABLOCORREAPRIETO.CH</text>
<text x="1685" y="919" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6C737C" text-anchor="end">Pablo Correa Prieto · 2026 · CC BY 4.0</text>
</svg>
