<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="945" viewBox="0 0 1800 945" lang="fr">
<defs>
<style>
@font-face{font-family:'Source Serif 4'; src:url(../../title-card/fonts/source-serif-4-latin-opsz-normal.woff2) format('woff2'); font-weight:200 900}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); font-weight:400}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); font-weight:500}
@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); font-weight:600}
.serif{font-variation-settings:'opsz' 60}
</style>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M1,1 L10,6 L1,11" fill="none" stroke="#264A6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1800" height="945" fill="#E8EDF2"/>
<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">ÉVALUER UN ITEM · TROIS QUESTIONS</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Juste ne veut pas dire aligné<tspan fill="#B8492A">.</tspan></text>
<line x1="115" y1="300" x2="599" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="115" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="72" font-weight="400" fill="#B8492A">1</text>
<text class="serif" x="115" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Alignement</text>
<text x="115" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">L’item vise-t-il l’objectif</text>
<text x="115" y="573" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">du PER annoncé ?</text>
<line x1="658" y1="300" x2="1142" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="658" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="72" font-weight="400" fill="#B8492A">2</text>
<text class="serif" x="658" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Exigence cognitive</text>
<text x="658" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">Quel niveau de réflexion</text>
<text x="658" y="573" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">demande-t-il vraiment ?</text>
<line x1="1201" y1="300" x2="1685" y2="300" stroke="#E2E3DF" stroke-width="2"/>
<text class="serif" x="1201" y="398" font-family="'Source Serif 4', Georgia, serif" font-size="72" font-weight="400" fill="#B8492A">3</text>
<text class="serif" x="1201" y="478" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="500" fill="#1C2128" data-maxw="484">Qualité</text>
<text x="1201" y="532" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">Est-il juste, clair, sans indice,</text>
<text x="1201" y="573" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="484">avec une seule bonne réponse ?</text>
<text x="115" y="710" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#1C2128" text-anchor="start" data-maxw="1570">Un item peut réussir l’une de ces questions et échouer aux deux autres.</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Cadre de l’étude en préparation de Pablo Correa Prieto (projet OSF osf.io/b653h). Schéma : Pablo Correa Prieto.</text>
<line x1="115" y1="795" x2="1685" y2="795" stroke="#E2E3DF" stroke-width="2"/>
<text x="115" y="855" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28"><tspan font-weight="600" fill="#1C2128">Pablo Correa Prieto</tspan><tspan fill="#5B626C"> · enseignant et recherche en éducation</tspan></text>
<text x="1685" y="854" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#264A6E" text-anchor="end" letter-spacing="3">PABLOCORREAPRIETO.CH</text>
<text x="1685" y="919" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6C737C" text-anchor="end">Pablo Correa Prieto · 2026 · CC BY 4.0</text>
</svg>
