@font-face{font-family:'IBM Plex Sans'; src:url(../../title-card/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); font-weight:600}
.serif{font-variation-settings:'opsz' 60}
</style>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
<path d="M1,1 L10,6 L1,11" fill="none" stroke="#264A6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1800" height="945" fill="#FAFAF8"/>
<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">RESEARCH · METHODS</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Methods in the service of questions<tspan fill="#B8492A">.</tspan></text>
<rect x="115" y="290" width="770" height="200" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<rect x="115" y="290" width="8" height="200" rx="3" fill="#2F6DB0"/>
<text class="serif" x="151" y="352" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="500" fill="#1C2128" data-maxw="700">Document analysis</text>
<text x="151" y="400" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">A corpus of official texts, the WPR frame,</text>
<text x="151" y="435" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">independent second coding.</text>
<rect x="915" y="290" width="770" height="200" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<rect x="915" y="290" width="8" height="200" rx="3" fill="#2F6DB0"/>
<text class="serif" x="951" y="352" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="500" fill="#1C2128" data-maxw="700">Cluster-randomised trial</text>
<text x="951" y="400" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">Whole schools drawn at random, a control</text>
<text x="951" y="435" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">arm, the effect of a training.</text>
<rect x="115" y="520" width="770" height="200" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<rect x="115" y="520" width="8" height="200" rx="3" fill="#2F6DB0"/>
<text class="serif" x="151" y="582" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="500" fill="#1C2128" data-maxw="700">Scales and questionnaires</text>
<text x="151" y="630" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">Attitude and intention to use,</text>
<text x="151" y="665" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">reliability of the instruments.</text>
<rect x="915" y="520" width="770" height="200" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
<rect x="915" y="520" width="8" height="200" rx="3" fill="#2F6DB0"/>
<text class="serif" x="951" y="582" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="500" fill="#1C2128" data-maxw="700">Item judgement</text>
<text x="951" y="630" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">Curricular alignment, cognitive demand</text>
<text x="951" y="665" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="700">and quality of generated items.</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Methods used across the author’s work. Diagram: Pablo Correa Prieto.</text>
<line x1="115" y1="795" x2="1685" y2="795" stroke="#E2E3DF" stroke-width="2"/>
<text x="115" y="855" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28"><tspan font-weight="600" fill="#1C2128">Pablo Correa Prieto</tspan><tspan fill="#5B626C"> · teacher and education researcher</tspan></text>
<text x="1685" y="854" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#264A6E" text-anchor="end" letter-spacing="3">PABLOCORREAPRIETO.CH</text>
<text x="1685" y="919" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6C737C" text-anchor="end">Pablo Correa Prieto · 2026 · CC BY 4.0</text>
</svg>
