<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Enfoque según Bacchi, C. (2009). Analysing Policy: What’s the problem represented to be? Pearson Australia.</text>
<text x="115" y="780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Artículo en preparación. Esquema: Pablo Correa Prieto.</text>
