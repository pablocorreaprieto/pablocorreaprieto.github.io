<text x="145" y="584" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="410">en la escuela obligatoria.</text>
<rect x="705" y="350" width="430" height="250" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
