<text class="serif" x="735" y="438" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="450" fill="#1C2128" data-maxw="370">Enfoque WPR</text>
<text x="735" y="520" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="370">«What’s the problem</text>
