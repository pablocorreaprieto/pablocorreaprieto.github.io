<rect width="1800" height="945" fill="#FAFAF8"/>
<text x="115" y="111" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#264A6E" text-anchor="start" letter-spacing="4" data-maxw="1570">POLÍTICAS · ARTÍCULO EN PREPARACIÓN</text>
<text class="serif" x="112" y="228" font-family="'Source Serif 4', Georgia, serif" font-size="76" font-weight="450" fill="#1C2128" letter-spacing="-1.5" data-maxw="1570">Lo que los textos hacen decir a la IA<tspan fill="#B8492A">.</tspan></text>
<rect x="115" y="350" width="470" height="250" rx="6" fill="#FFFFFF" stroke="#E2E3DF" stroke-width="2"/>
