<text x="115" y="712" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#1C2128" text-anchor="start" data-maxw="1570">Randomising the whole school keeps a trained teacher from influencing a colleague in the control arm.</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Study in preparation, primary teachers in the canton of Vaud. Diagram: Pablo Correa Prieto.</text>
