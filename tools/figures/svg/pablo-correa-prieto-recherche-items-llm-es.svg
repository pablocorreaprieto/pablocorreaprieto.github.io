<text x="115" y="710" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#1C2128" text-anchor="start" data-maxw="1570">Un ítem correcto no está necesariamente alineado: los tres juicios son distintos.</text>
<text x="115" y="752" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Artículo en preparación; los tres criterios se presentan en «Tres preguntas para juzgar un ítem».</text>
<text x="115" y="780" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B626C" text-anchor="start" data-maxw="1570">Esquema: Pablo Correa Prieto.</text>
