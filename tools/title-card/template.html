<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Source Serif 4"; src:url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2"); font-weight:200 900; font-style:normal}
  @font-face{font-family:"IBM Plex Sans"; src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); font-weight:400}
  @font-face{font-family:"IBM Plex Sans"; src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); font-weight:500}
  @font-face{font-family:"IBM Plex Sans"; src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); font-weight:600}

  /* Site palette (light), same values as the pages' :root */
  :root{--ground:#FAFAF8; --soft:#E8EDF2; --ink:#1C2128; --muted:#5B626C; --faint:#6C737C; --rule:#E2E3DF; --accent:#264A6E; --mark:#B8492A}
  *{margin:0; box-sizing:border-box}
  html,body{width:1800px; height:945px}
  body{background:var(--ground); color:var(--ink); font-family:"IBM Plex Sans", sans-serif; position:relative; overflow:hidden}
  body.soft{background:var(--soft)}
  .kicker{position:absolute; left:115px; top:91px; font-weight:600; font-size:25px; letter-spacing:.162em; text-transform:uppercase; color:var(--accent)}
  .title{position:absolute; left:112px; top:177px; font-family:"Source Serif 4", serif; font-weight:450; font-variation-settings:"opsz" 60; font-size:176px; line-height:177px; letter-spacing:-0.04em}
  .title .dot{color:var(--mark)}
  .rule{position:absolute; left:115px; right:115px; top:795px; border-top:2px solid var(--rule)}
  .foot{position:absolute; left:115px; right:115px; top:826px; display:flex; justify-content:space-between; align-items:baseline}
  .who{font-size:28px}
  .who b{font-weight:600}
  .who span{color:var(--muted)}
  .domain{font-weight:600; font-size:22px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
  .credit{position:absolute; right:115px; bottom:26px; font-size:17px; color:var(--faint)}
</style>
</head>
<body>
  <div class="kicker" id="kicker"></div>
  <div class="title" id="title"></div>
  <div class="rule"></div>
  <div class="foot">
    <div class="who"><b id="name"></b><span id="tagline"></span></div>
    <div class="domain" id="domain"></div>
  </div>
  <div class="credit" id="credit"></div>
</body>
</html>
